# Workspace: el plugin local comparte este target/ (ignorado) en vez de
# generar el suyo propio dentro de plugins/.
[workspace]
members = ["plugins/tauri-plugin-secure-keys"]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
# Spawn del sidecar Node del pipeline desde Rust (ADR-0010); no se expone al
# webview, por eso no hay capability shell en capabilities/default.json.
tauri-plugin-shell = "2"
thiserror = "2"
# jobId de los jobs del pipeline.
uuid = { version = "1", features = ["v4"] }
# rustls (+ roots de Mozilla embebidas) en vez del TLS nativo para que el mismo
# binario compile igual en Android (ADR-0011).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

# El crate keyring no soporta Android: ahí la fuente es el plugin propio
# tauri-plugin-secure-keys (Android Keystore). Ver ADR-0011.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-secure-keys = { path = "plugins/tauri-plugin-secure-keys" }
