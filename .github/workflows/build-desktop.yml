# Instaladores de escritorio de Vimo (ADR-0026): NSIS para Windows x64 y DMG
# para macOS Apple Silicon, un job por plataforma sobre build-installer.yml.
# Se dispara a mano o al pushear un tag v*; NUNCA en cada push: en repos
# privados los minutos de macOS cuentan x10 y los de Windows x2 sobre la cuota
# gratuita.
#
# Al disparar a mano se elige la plataforma; el job que no coincide se salta
# sin consumir minutos. El tag v* siempre genera ambos instaladores. Son dos
# jobs y no una matriz porque el contexto `matrix` no existe en el `if` de job.
#
# macOS se firma con Developer ID y se notariza: las credenciales son secretos
# del repo (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, APPLE_ID, …) que
# build-installer.yml pasa a Tauri; ver docs/CONTRIBUTING.es.md. Windows sigue
# sin Authenticode: SmartScreen avisa al instalar (deuda documentada ahí mismo).
name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a compilar (macOS cuesta x10 minutos)'
        type: choice
        default: all
        options: [all, windows, macos]
  push:
    tags: ['v*']

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      os: windows-latest
      target: x86_64-pc-windows-msvc
      bundles: nsis
      artifact: Vimo-windows-x64
      path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      os: macos-latest
      target: aarch64-apple-darwin
      bundles: dmg
      artifact: Vimo-macos-arm64
      path: src-tauri/target/release/bundle/dmg/*.dmg
