# Instaladores de escritorio de Vimo (ADR-0026): NSIS para Windows x64 y DMG
# para macOS Apple Silicon, uno por job de la matriz. Se dispara a mano o al
# pushear un tag v*; NUNCA en cada push: en repos privados los minutos de
# macOS cuentan x10 y los de Windows x2 sobre la cuota gratuita.
#
# Sin firma de código: SmartScreen y Gatekeeper avisan al instalar (deuda
# documentada en docs/CONTRIBUTING.es.md). Con certificado, las credenciales
# van como secretos del repo (APPLE_SIGNING_IDENTITY, etc.) sin tocar el YAML.
name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a compilar (macOS cuesta x10 minutos)'
        type: choice
        default: all
        options: [all, windows, macos]
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: Vimo-windows-x64
            path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: Vimo-macos-arm64
            path: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    # Al disparar a mano se puede compilar una sola plataforma; el job saltado no
    # consume minutos. El tag v* siempre genera ambos instaladores.
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Este runtime de Node es la base del sidecar SEA (scripts/build-sidecar.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Ejecuta beforeBuildCommand: fetch:binaries (ffmpeg y yt-dlp pineados
      # por target triple), build:sidecar y el build de la interfaz.
      # Vite embebe las VITE_* en el bundle en tiempo de build: sin ellas el
      # cliente de Supabase lanza al cargar y la app abre en blanco.
      - uses: tauri-apps/tauri-action@v0
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}

      # Retención corta: el plan Free de GitHub da 500 MB de artefactos en
      # repos privados y cada corrida pesa ~270 MB.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 3
