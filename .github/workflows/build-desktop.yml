# Instaladores de escritorio de Vimo (ADR-0026, ADR-0034): NSIS para Windows
# x64 y DMG para macOS Apple Silicon e Intel, una pierna de matriz por target
# sobre build-installer.yml. Los targets se declaran en
# scripts/release-targets.mjs: agregar una plataforma es agregar una entrada
# ahí, nunca un job suelto acá.
#
# Se dispara a mano o al pushear un tag v*; NUNCA en cada push: en repos
# privados los minutos de macOS cuentan x10 y los de Windows x2 sobre la cuota
# gratuita. Un tag consume dos jobs de macOS (arm64 e Intel).
#
# Al disparar a mano se elige qué compilar: todo, una familia (windows, macos)
# o un target puntual. El job `plan` filtra los targets ANTES de armar la
# matriz —el contexto `matrix` no existe en el `if` de job—, así que lo que no
# se eligió no consume minutos. El tag v* siempre genera todos los instaladores
# y además corre `publish` (ADR-0027): arma latest.json con las firmas
# minisign, sube los instaladores a Cloudflare R2 y deja el manifiesto como
# artefacto para commitearlo a mano en la landing (vimo.click).
#
# macOS se firma con Developer ID y se notariza: las credenciales son secretos
# del repo (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, APPLE_ID, …) que
# build-installer.yml pasa a Tauri; ver docs/CONTRIBUTING.es.md. Windows sigue
# sin Authenticode: SmartScreen avisa al instalar (deuda documentada ahí mismo).
name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        # Las opciones deben coincidir con validSelections() de
        # scripts/release-targets.mjs; una que no exista hace fallar `plan`.
        description: 'Qué compilar: todo, una familia o un target (macOS cuesta x10 minutos)'
        type: choice
        default: all
        options: [all, windows, macos, windows-x64, macos-arm64, macos-x64]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Con un tag `inputs.platform` llega vacío: se compilan todos los targets.
      - id: targets
        env:
          SELECTION: ${{ inputs.platform || 'all' }}
        run: node scripts/release-targets.mjs matrix --select "$SELECTION" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      # Un target roto no cancela los demás: sus artefactos sirven para
      # diagnosticar. `publish` igual exige que todos terminen bien.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      artifact: ${{ matrix.artifact }}
      path: ${{ matrix.path }}

  # Linux valida la entrega de la extensión sin añadir un instalador Linux
  # ni consumir otra compilación de macOS. El workflow no recibe secretos.
  extension-linux:
    uses: ./.github/workflows/test-extension-linux.yml

  # Solo con tag: junta los artefactos de todos los targets, genera latest.json
  # (scripts/build-update-manifest.mjs), sube los binarios a Cloudflare R2 y
  # deja el manifiesto como artefacto del run. El commit de latest.json en
  # public/releases/ del repo de la landing se hace a mano (Cloudflare Pages lo
  # sirve en https://vimo.click/releases/latest.json, el endpoint de la app).
  # Los binarios no pueden ir a la landing: Pages limita cada archivo a 25 MB.
  #
  # Variable del repo: RELEASES_PUBLIC_URL (URL pública del bucket, con /).
  # Secretos: RELEASES_S3_ENDPOINT, RELEASES_S3_BUCKET, RELEASES_ACCESS_KEY_ID y
  # RELEASES_SECRET_ACCESS_KEY. Sin ellos la subida se salta sin fallar.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, extension-linux]
    runs-on: ubuntu-latest
    env:
      RELEASES_PUBLIC_URL: ${{ vars.RELEASES_PUBLIC_URL }}
      RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
      RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
    steps:
      # Sin `fetch-tags`: con un tag anotado, actions/checkout intenta traer el
      # commit y el tag al mismo ref y falla («Cannot fetch both …»). El
      # checkout deja un tag ligero, así que se trae el anotado a mano con
      # --force para que `git tag -l --format='%(contents)'` vea las notas.
      - uses: actions/checkout@v4

      - run: git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cada artefacto queda en artifacts/<nombre>/: el manifiesto busca los
      # archivos de cada target solo dentro de su carpeta.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Las notas del update salen del mensaje del tag anotado; con un tag
      # ligero quedan vacías.
      - run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.txt

      # Sin RELEASES_PUBLIC_URL el manifiesto se arma igual con un placeholder,
      # para que el run no falle antes de dejar los artefactos.
      # Aborta si el tag no coincide con package.json o falta un artefacto o
      # una firma: nunca se publica un latest.json incompleto.
      - run: >
          node scripts/build-update-manifest.mjs
          --tag "$GITHUB_REF_NAME"
          --input artifacts
          --output release
          --base-url "${RELEASES_PUBLIC_URL:-https://RELEASES_PUBLIC_URL-sin-configurar/}$GITHUB_REF_NAME/"
          --notes-file release-notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vimo-release-manifest-${{ github.ref_name }}
          path: release/latest.json
          if-no-files-found: error
          retention-days: 3

      # Binarios a R2 (API S3), en una carpeta por tag. Llevan la versión en el
      # nombre: se cachean como inmutables.
      - if: env.RELEASES_S3_BUCKET != '' && env.RELEASES_S3_ENDPOINT != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >
          aws s3 sync release "s3://$RELEASES_S3_BUCKET/$GITHUB_REF_NAME/"
          --endpoint-url "$RELEASES_S3_ENDPOINT"
          --exclude latest.json
          --cache-control "public, max-age=31536000, immutable"
