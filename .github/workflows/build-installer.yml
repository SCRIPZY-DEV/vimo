# Compila un instalador de escritorio para un target (ADR-0026, ADR-0034). Es
# un workflow reutilizable: lo llama build-desktop.yml una vez por target de
# scripts/release-targets.mjs y no se dispara solo. Los secretos VITE_*,
# APPLE_* y TAURI_SIGNING_* llegan con `secrets: inherit`.
#
# Además del instalador genera los artefactos del updater firmados con
# minisign (ADR-0027): en Windows la firma `.exe.sig` del mismo setup, en macOS
# `Vimo.app.tar.gz` + `.sig`. Sin TAURI_SIGNING_PRIVATE_KEY el build FALLA a
# propósito: un instalador sin firma no puede publicarse como actualización.
name: Build installer

on:
  workflow_call:
    inputs:
      os:
        description: 'Runner de la misma arquitectura que el target (windows-latest, macos-latest, macos-15-intel)'
        type: string
        required: true
      target:
        description: 'Target triple de Rust'
        type: string
        required: true
      bundles:
        description: 'Bundles de Tauri (nsis, app,dmg)'
        type: string
        required: true
      artifact:
        description: 'Nombre del artefacto'
        type: string
        required: true
      path:
        description: 'Globs de los archivos a subir (uno por línea)'
        type: string
        required: true

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Este runtime de Node es la base del sidecar SEA (scripts/build-sidecar.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Ejecuta beforeBuildCommand: fetch:binaries (ffmpeg y yt-dlp pineados
      # por target triple), build:sidecar y el build de la interfaz.
      # Vite embebe las VITE_* en el bundle en tiempo de build: sin ellas el
      # cliente de Supabase lanza al cargar y la app abre en blanco.
      #
      # Firma y notarización de macOS (Developer ID, fuera de la App Store). Con
      # las APPLE_* presentes, Tauri CLI importa el .p12 en un llavero temporal,
      # firma la .app y los externalBin con hardened runtime y los entitlements
      # de src-tauri/Entitlements.plist, notariza con notarytool y grapa el
      # ticket al DMG. Si faltan (un fork sin secretos) vuelve a firma ad-hoc y
      # no notariza: el build no rompe, pero Gatekeeper marca la app como
      # «dañada» al descargarla. En el job de Windows se ignoran.
      #
      # `--config tauri.updater.conf.json` activa createUpdaterArtifacts solo
      # acá: así `pnpm tauri build` local sigue compilando sin la clave privada.
      # El Vimo.app.tar.gz del updater se arma con la .app ya firmada.
      #
      # `--target` deja el triple explícito en vez de heredarlo del runner: Tauri
      # lo exporta como TAURI_ENV_TARGET_TRIPLE (fetch-binaries y build-sidecar
      # eligen pins y runtime con él) y el bundle queda en
      # target/<triple>/release/bundle, la ruta que arma release-targets.mjs.
      # Si runner y triple no coinciden, build-sidecar aborta.
      - uses: tauri-apps/tauri-action@v0
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ inputs.target }} --bundles ${{ inputs.bundles }} --config src-tauri/tauri.updater.conf.json

      # Retención corta: el plan Free de GitHub da 500 MB de artefactos en
      # repos privados y cada corrida pesa ~270 MB.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.path }}
          if-no-files-found: error
          retention-days: 3
